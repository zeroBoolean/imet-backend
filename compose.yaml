services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: imet
      POSTGRES_PASSWORD: imet_local_only
      POSTGRES_DB: imet
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - imet_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imet -d imet']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - imet_redis:/data
volumes:
  imet_postgres:
  imet_redis:
